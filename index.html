<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jazrell Portfolio</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    overflow-x:hidden;
}

.hero{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
}

.hero video{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    min-width:100%;
    min-height:100%;
    object-fit:cover;
    z-index:-2;
}

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:-1;
}

.hero-content{
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    padding:20px;
}

.hero-content h3{
    color:#38bdf8;
    letter-spacing:2px;
    margin-bottom:10px;
}

.hero-content h1{
    font-size:5rem;
}

.hero-content span{
    color:#38bdf8;
}

.hero-content p{
    max-width:700px;
    margin-top:20px;
    line-height:1.7;
    color:#ddd;
}

.buttons{
    margin-top:30px;
}

.btn{
    display:inline-block;
    padding:14px 30px;
    margin:10px;
    border-radius:50px;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}

.primary{
    background:#38bdf8;
    color:#111827;
}

.primary:hover{
    background:#0ea5e9;
}

.secondary{
    border:2px solid #38bdf8;
    color:white;
}

.secondary:hover{
    background:#38bdf8;
    color:black;
}
</style>
</head>
<body>

<section class="hero">

    <video autoplay muted loop playsinline>
        videos/hero-video.mp4
    </video>

    <div class="overlay"></div>

    <div class="hero-content">
        <h3>WELCOME TO MY PORTFOLIO</h3>

        <h1>Hi, I'm <span>Jazrell</span></h1>

        <p>
            A passionate developer, designer, and creative problem solver.
            I build websites, applications, and digital experiences that
            combine functionality with modern design.
        </p>

        <div class="buttons">
            #projectsView Projects</a>
            <a hreftContact Me</a>
        </div>
    </div>

</section>

</body>
</html>
